\* expect: violated NoDropFreshAnswer
\* module: RunnerStore
\* Over-drop mutant of the turn-end reader: a live answer is dropped instead of
\* delivered, so the one fresh answer is lost.
CONSTANTS
    Slots = {1, 2}
    Drain = "none"
    Requeue = "carry"
    NoHandle = "admit"
SPECIFICATION Spec
INVARIANTS TypeOK NoDropFreshAnswer NoStaleAdmission
CHECK_DEADLOCK FALSE
